<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Minha página</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <h1 id="topo">Minha página</h1>
  <p class="destaque">Leia aqui.</p>
  <p>Texto comum.</p>

  <!-- Teste de conflito: tag + classe + ID no mesmo elemento -->
  <p id="teste" class="destaque">Teste de cor</p>

  <!-- Teste de empate: duas regras para a mesma tag -->
  <p class="empate">Teste de ordem das regras</p>
</body>
</html>
